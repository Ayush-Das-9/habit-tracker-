<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h1 class="login-title">Habit Tracker</h1>
      <p class="login-sub">Enter your 5-digit Person ID</p>
      <input type="text" id="pid-input" maxlength="5" placeholder="e.g. 10001" inputmode="numeric" autocomplete="off" />
      <button id="pid-btn">Enter</button>
      <p id="login-error"></p>
    </div>
  </div>

  <!-- DASHBOARD (hidden until login) -->
  <div id="app" style="display:none;">

    <div class="top-bar">
      <span id="top-pid"></span>
      <button id="logout-btn">Logout</button>
    </div>

    <!-- CALENDAR -->
    <section class="calendar-section">
      <div class="cal-header">
        <span class="cal-month" id="cal-month-name"></span>
        <span class="cal-year" id="cal-year-val"></span>
      </div>
      <div class="cal-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span>
        <span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="legend">
        <span class="legend-label">less</span>
        <div class="legend-dot ld-0"></div>
        <div class="legend-dot ld-1"></div>
        <div class="legend-dot ld-2"></div>
        <div class="legend-dot ld-3"></div>
        <div class="legend-dot ld-4"></div>
        <span class="legend-label">more</span>
      </div>
    </section>

    <!-- ADD DAILY HABIT -->
    <div class="add-row">
      <input type="text" id="new-activity" placeholder="New daily habit…" maxlength="100" />
      <button id="add-btn">🔄 Add Daily</button>
    </div>

    <!-- ACTIVITIES -->
    <div id="activities-list"></div>

    <!-- AI AGENT -->
    <button id="agent-btn">🤖 Ask AI Agent</button>

    <!-- AGENT MODAL -->
    <div id="agent-overlay" class="agent-overlay" style="display:none;">
      <div class="agent-modal">
        <div class="agent-header">
          <span>🤖 AI Agent Analysis</span>
          <button id="agent-close" class="agent-close">&times;</button>
        </div>
        <div id="agent-content" class="agent-content">
          <p class="agent-loading">Agent is generating...</p>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
